name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy (strict)
        run: mypy

      - name: coverage
        run: pytest -q --cov=csvsurgeon --cov-report=term-missing

  dogfood:
    name: transform this repository's own sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e .

      # Exercises the real console script end to end, including the
      # ordering rule that --filter after --compute sees the new column.
      - name: run the documented example
        run: |
          set -euo pipefail
          actual=$(csvsurgeon examples/people.csv \
            --filter "\$age > 20" \
            --compute "label=lower(\$city) + '-' + \$name" \
            --select "label" | tr -d "\r")
          expected=$'label\nlondon-Ada\nlondon-Cy'
          test "$actual" = "$expected" || {
            echo "unexpected output:"; echo "$actual"; exit 1;
          }
