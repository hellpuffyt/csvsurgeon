[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csvsurgeon"
version = "0.1.0"
description = "Stream-transform very large CSV files with a small, safe expression language, never loading the file into memory."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Prabesh Sharma" }]
keywords = ["csv", "streaming", "data", "etl", "cli", "transform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
csvsurgeon = "csvsurgeon.cli:main"

[project.urls]
Homepage = "https://github.com/hellpuffyt/csvsurgeon"
Issues = "https://github.com/hellpuffyt/csvsurgeon/issues"
Changelog = "https://github.com/hellpuffyt/csvsurgeon/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/csvsurgeon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
